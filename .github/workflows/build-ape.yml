name: Build and verify APE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ape-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build ${{ matrix.profile }} APE (Linux x86_64)
    strategy:
      fail-fast: false
      matrix:
        profile: [base, full]
    env:
      QUICKJS_COSMO_RUNTIME_PROFILE: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate CI helpers and compatibility contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Cache verified input archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cosmocc-*.zip
            .cache/quickjs-source.tar.gz
            .cache/cosmopolitan-nightly-source.tar.gz
            .cache/cosmo-compat/nightly/
            .cache/dev-tools/
            .cache/kernel64k/
          key: ape-inputs-${{ hashFiles('versions.json', 'native/versions.json', 'compat/versions.json', 'compat/dev-tools.json') }}
      - name: Build locked QuickJS and cosmocc inputs
        env:
          GH_TOKEN: ${{ secrets.COSMOCC_ARTIFACT_TOKEN || github.token }}
          COSMOCC_ARCHIVE_URL: ${{ vars.COSMOCC_ARCHIVE_URL }}
          JOBS: "4"
        run: sh scripts/build.sh
      - name: Test build host and compile standalone APEs
        run: |
          TOOLCHAIN=$(python scripts/build_config.py toolchain)
          export PATH="$TOOLCHAIN/bin:$PATH"
          python scripts/prepare_native.py --node
          python scripts/test.py --upstream --compile --node-compat --expected-platform linux --expected-arch x86_64 --expected-execution-arch x86_64
      - name: Check implemented API declarations
        run: python scripts/check_types.py
      - name: Create official release ZIP
        run: python scripts/package.py --validate
      - name: Prepare locked ARM64 64K kernel guest
        run: python scripts/test_kernel64k.py --prepare-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel64k-guest-${{ matrix.profile }}
          path: |
            build/kernel64k/preparation.json
            build/kernel64k/initramfs.cpio.gz
            build/kernel64k/inputs/vmlinuz-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Pack tested SDK, sources and standalone programs
        run: python scripts/ci_artifact.py pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickjs-cosmo-build-${{ matrix.profile }}
          path: |
            build/ci/quickjs-cosmo-ci.tar.gz
            build/ci/quickjs-cosmo-ci.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save build test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.profile }}-build-linux-x86_64
          path: |
            build/profiles/
            build/terminal/
            build/test-results/*.json
            build/runtime-audit/nightly-regression-*.json
            build/node-compat/*.json
            build/native/probe-*.json
            build/native/backends-*.json
            build/native/crypto/build.json
            build/native/compression/build.json
            build/interop/compression.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify ${{ matrix.profile }} ${{ matrix.runner }} (${{ matrix.arch }}, APE ${{ matrix.execution_arch }})
    env:
      QUICKJS_COSMO_RUNTIME_PROFILE: ${{ matrix.profile }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [base, full]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022, windows-2025, windows-11-arm]
        include:
          - {runner: ubuntu-24.04, platform: linux, arch: x86_64, execution_arch: x86_64, python_arch: x64}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64, execution_arch: arm64, python_arch: arm64}
          - {runner: macos-15-intel, platform: darwin, arch: x86_64, execution_arch: x86_64, python_arch: x64}
          - {runner: macos-15, platform: darwin, arch: arm64, execution_arch: arm64, python_arch: arm64}
          - {runner: windows-2022, platform: win32, arch: x86_64, execution_arch: x86_64, python_arch: x64}
          - {runner: windows-2025, platform: win32, arch: x86_64, execution_arch: x86_64, python_arch: x64}
          # APE's Windows PE entry is x64; this row tests Windows ARM64's x64 compatibility layer.
          - {runner: windows-11-arm, platform: win32, arch: arm64, execution_arch: x86_64, python_arch: x64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quickjs-cosmo-build-${{ matrix.profile }}
          path: build/ci
      - name: Verify and unpack the same build
        run: python scripts/ci_artifact.py unpack
      - name: Restore upstream tests from the pinned source archive
        run: python scripts/bootstrap.py --source-only --offline
      - name: Cache checksum-locked Node compatibility archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/node-baseline/
          key: node-oracle-${{ matrix.platform }}-${{ matrix.execution_arch }}-${{ hashFiles('compat/node-baseline.json') }}
      - name: Prepare checksum-locked Node compatibility oracle
        run: python scripts/prepare_native.py --node
      - name: Run existing tests and cross-host standalone APEs
        run: >-
          python scripts/test.py --upstream --node-compat
          --standalone build/test-linux/hello-standalone.exe
          --expected-platform ${{ matrix.platform }}
          --expected-arch ${{ matrix.arch }}
          --expected-execution-arch ${{ matrix.execution_arch }}
      - name: Confirm the tested payload still matches the build
        run: python scripts/ci_artifact.py verify
      - name: Require complete platform and Node evidence
        run: python scripts/release_evidence.py platform --runner ${{ matrix.runner }}
      - name: Save platform test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.profile }}-${{ matrix.runner }}
          # Only aggregate reports; per-case fixtures contain inherited environments.
          path: |
            build/profiles/
            build/terminal/
            build/release-evidence/*.json
            build/test-results/*.json
            build/runtime-audit/nightly-regression-*.json
            build/node-compat/*.json
            build/native/probe-*.json
            build/native/backends-*.json
          if-no-files-found: warn
          retention-days: 14

  kernel64k:
    name: Verify ${{ matrix.profile }} ARM64 kernel (64K pages)
    strategy:
      fail-fast: false
      matrix:
        profile: [base, full]
    env:
      QUICKJS_COSMO_RUNTIME_PROFILE: ${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quickjs-cosmo-build-${{ matrix.profile }}
          path: build/ci
      - run: python scripts/ci_artifact.py unpack
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel64k-guest-${{ matrix.profile }}
          path: build/kernel64k
      - name: Install full-system QEMU
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y qemu-system-arm
      - name: Run the same payload in the real 64K kernel
        run: python scripts/test_kernel64k.py --prepared
      - name: Verify payload immutability after guest execution
        run: python scripts/ci_artifact.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.profile }}-kernel64k
          path: |
            build/kernel64k/results.json
            build/kernel64k/console.log
          if-no-files-found: error
          retention-days: 14

  certify:
    name: Certify ${{ matrix.profile }} release
    strategy:
      fail-fast: false
      matrix:
        profile: [base, full]
    env:
      QUICKJS_COSMO_RUNTIME_PROFILE: ${{ matrix.profile }}
    if: always()
    needs: [build, verify, kernel64k]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful build and every matrix row
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          KERNEL_RESULT: ${{ needs.kernel64k.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$VERIFY_RESULT" != success ] || [ "$KERNEL_RESULT" != success ]; then
            echo "Build=$BUILD_RESULT; matrix=$VERIFY_RESULT; kernel64k=$KERNEL_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quickjs-cosmo-build-${{ matrix.profile }}
          path: build/ci
      - name: Verify release payload after the matrix passes
        run: python scripts/ci_artifact.py unpack
      - name: Download all platform reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-${{ matrix.profile }}-*
          path: build/matrix-reports
          merge-multiple: false
      - name: Require seven matching platform evidence records
        run: python scripts/release_evidence.py aggregate --reports build/matrix-reports
      - name: Save validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickjs-cosmo-certified-${{ matrix.profile }}
          path: |
            releases/quickjs-cosmo-*.zip
            releases/quickjs-cosmo-*.zip.sha256
            releases/internal/
            releases/assets-${{ matrix.profile }}.json
            .cache/quickjs-source.tar.gz
            dist/variants/*/*.json
            dist/manifest.json
            dist/capabilities.json
            releases/compatibility-report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  ci:
    name: CI gate
    if: always()
    needs: [build, verify, kernel64k, certify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require both profiles and all platform gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os; assert all(v['result']=='success' for v in json.loads(os.environ['RESULTS']).values())"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quickjs-cosmo-certified-*
          path: build/certified
          merge-multiple: false
      - name: Revalidate both profiles and assemble eight release assets
        run: python scripts/assemble_release.py --certified build/certified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickjs-cosmo-release
          path: releases/public/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quickjs-cosmo-release
          path: releases/public
      - name: Publish the current tag after the complete CI gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
